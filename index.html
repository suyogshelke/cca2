<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCA2 - DevOps Demo</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      color: #ffffff;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
      text-align: center;
      max-width: 500px;
    }
    h1 {
      margin-bottom: 10px;
    }
    p {
      color: #e0e0e0;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🚀 CCA2 Project</h1>
    <p>Successfully uploaded from local repository to GitHub!</p>
  </div>
</body>
</html>
